<!DOCTYPE html>
<html lang="tr">



  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Great Vibes font -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <title>İyi gecelerrr defnemm</title>

  <style>
  .gallery {
  width: 100%;
  max-width: 420px;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;

  padding: 26px;
  border-radius: 28px;

  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(8px);

  position: relative;
  z-index: 2;
}

/* Tüm fotolar */
.gallery img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;

  border-radius: 20px;
  transition: transform 0.35s ease, box-shadow 0.35s ease;

  box-shadow: 0 6px 16px rgba(0,0,0,0.35);
}

/* Küçükler */
.gallery .small:hover {
  transform: scale(1.06);
  box-shadow: 0 0 14px rgba(255, 220, 140, 0.35);
}

/* ORTA FOTO (ANA ODAK) */
.gallery .center {
  transform: scale(1.18);
  z-index: 3;

  box-shadow:
    0 0 22px rgba(255, 220, 140, 0.55),
    0 12px 30px rgba(0,0,0,0.45);
}

/* Orta foto hover */
.gallery .center:hover {
  transform: scale(1.22);
}

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #000000, #210e63);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      overflow-x: hidden;
    }

    /* Popup */
    #nightPopup {
      position: fixed;
      bottom: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 420px;
      background: rgba(20, 20, 30, 0.85);
      color: #fff;
      padding: 22px 24px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      transition: bottom 0.6s ease;
      z-index: 9999;
    }

    #nightPopup.show {
      bottom: 20px;
    }

    #nightPopup span {
      font-size: 1rem;
      font-weight: 600;
    }

    #nightPopup small {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    #closePopup {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Partikül canvas */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Fade in */
    .fade-in {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .fade-in.show {
      opacity: 1;
      transform: translateY(0);
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #e93f77;
      margin: 20px 0 10px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    p {
      font-family: 'Great Vibes', cursive;
      font-size: 1.7rem;
      color: #2eb1c2;
      margin-bottom: 30px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .flowers {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .flowers img {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 6px 14px rgba(0,0,0,0.18);
    }
  </style>
</head>

<body>

  <canvas id="particles"></canvas>

  <div class="fade-in">
    <h1>İyi Geceler Çiçeğimmm</h1>
    <p>Seni çoook seviyorummm</p>
  </div>

  <div class="gallery fade-in">
    <img src="f2.jpeg" class="small">
    <img src="kedipetunya.png" class="small">
    <img src="f4.png" class="small">
    <img src="kedigul.png" class="small">
    <img src="f1.jpeg" class="center">
    <img src="kediorkide.png" class="small">
    <img src="f4.jpeg" class="small">
    <img src="kedilavanta.png" class="small">
    <img src="f3.jpeg" class="small">
  </div>

  <audio id="bgMusic" loop>
    <source src="bguzic.mp3" type="audio/mpeg">
  </audio>

  <script>
    document.addEventListener("click", () => {
      document.getElementById("bgMusic").play();
    }, { once: true });
  </script>

  <!-- Partiküller -->
  <script>
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    const starImg = new Image();
    starImg.src = "yıldız.png";

    const particles = [];
    for (let i = 0; i < 45; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 7 + 12,
        speed: Math.random() * 0.7 + 0.3,
        rotate: Math.random() * Math.PI * 2,
        glow: Math.random() * Math.PI * 2
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotate);

        const glowStrength = (Math.sin(p.glow) + 1) / 2;

        ctx.shadowBlur = 10 + glowStrength * 20;
        ctx.shadowColor = "rgba(255, 220, 140, 0.9)";
        ctx.globalAlpha = 0.5 + glowStrength * 0.5;

        ctx.drawImage(starImg, -p.size / 2, -p.size / 2, p.size, p.size);

        ctx.restore();

        p.y += p.speed;
        p.rotate += 0.002;
        p.glow += 0.03;

        if (p.y > canvas.height + 40) {
          p.y = -40;
          p.x = Math.random() * canvas.width;
        }
      });

      requestAnimationFrame(animate);
    }

    starImg.onload = animate;
  </script>

  <!-- Fade-in -->
  <script>
    window.addEventListener("load", () => {
      document.querySelectorAll(".fade-in").forEach(el => {
        el.classList.add("show");
      });
    });
  </script>

  <!-- Popup -->
  <div id="nightPopup">
    <span>🌙 Tatlı rüyalarrr</span>
    <small>Rüyanda beni görrr 🤍🫶🏼✨</small>
    <button id="closePopup">✕</button>
  </div>

  <script>
    const popup = document.getElementById("nightPopup");
    const closeBtn = document.getElementById("closePopup");

    setTimeout(() => {
      popup.classList.add("show");
    }, 1500);

    closeBtn.addEventListener("click", () => {
      popup.classList.remove("show");
    });
  </script>

</body></div>




<script>
  const hour = new Date().getHours();

  const morning = document.getElementById("morningSite");
  const night = document.getElementById("nightSite");

  if (hour >= 21 || hour < 5) {
    // GECE
    morning.style.display = "none";
    night.style.display = "block";
  } else {
    // SABAH
    morning.style.display = "block";
    night.style.display = "none";
  }
</script>











</body>

</html>
